<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Joy Salon - Reservasi</title>

<style>

/* ==============================
   RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f1f5;
    color: #292129;
}


/* ==============================
   LAYOUT
================================ */

.app {
    display: flex;
    min-height: 100vh;
}


/* ==============================
   SIDEBAR
================================ */

.sidebar {
    width: 230px;
    min-height: 100vh;

    background: #321638;
    color: white;

    padding: 28px 18px;

    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
}

.logo {
    padding: 0 14px 30px;
}

.logo h2 {
    font-size: 21px;
    margin-bottom: 5px;
}

.logo span {
    color: #d2b9d4;
    font-size: 12px;
}

nav {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.menu {
    width: 100%;
    border: none;
    background: transparent;
    color: #dbc9dd;

    padding: 12px 13px;

    border-radius: 7px;

    text-align: left;

    cursor: pointer;

    font-size: 13px;

    transition: 0.2s;
}

.menu span {
    display: inline-block;
    width: 25px;
}

.menu:hover,
.menu.active {
    background: #512653;
    color: white;
}

.logout {
    margin-top: 12px;
}


/* ==============================
   MAIN
================================ */

.main {
    margin-left: 230px;

    width: calc(100% - 230px);

    min-height: 100vh;

    padding: 42px;
}


/* ==============================
   HEADER
================================ */

.header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 28px;
}

.header h1 {
    font-size: 27px;
}

.header p {
    margin-top: 7px;

    color: #8b818d;

    font-size: 13px;
}


/* ==============================
   BUTTON
================================ */

.btn-primary {
    background: #432044;

    border: none;

    color: white;

    padding: 12px 18px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 13px;

    transition: 0.2s;
}

.btn-primary:hover {
    background: #602d62;
}


/* ==============================
   FILTER
================================ */

.filter-card {
    background: white;

    border: 1px solid #e4dde4;

    border-radius: 9px;

    padding: 14px;

    display: grid;

    grid-template-columns: 1fr 150px 150px;

    gap: 10px;

    margin-bottom: 15px;
}

.filter-card input,
.filter-card select {
    height: 39px;

    border: 1px solid #ddd5dd;

    border-radius: 6px;

    padding: 0 12px;

    outline: none;

    font-size: 12px;

    color: #555;
}

.filter-card input:focus,
.filter-card select:focus {
    border-color: #6c3d6e;
}


/* ==============================
   TABLE
================================ */

.table-card {
    background: white;

    border: 1px solid #e4dde4;

    border-radius: 9px;

    overflow: hidden;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;

    border-collapse: collapse;

    min-width: 850px;
}

thead {
    background: #faf7fa;
}

th {
    padding: 15px 13px;

    text-align: left;

    font-size: 11px;

    color: #827982;

    border-bottom: 1px solid #eee8ee;
}

td {
    padding: 15px 13px;

    font-size: 12px;

    border-bottom: 1px solid #eee8ee;
}

tbody tr:hover {
    background: #fcfafc;
}


/* ==============================
   STATUS
================================ */

.status {
    display: inline-block;

    padding: 5px 9px;

    border-radius: 20px;

    font-size: 10px;

    font-weight: bold;
}

.status-menunggu {
    background: #fff4dc;
    color: #a47720;
    border: 1px solid #ead39d;
}

.status-dikonfirmasi {
    background: #fff7d9;
    color: #a17817;
    border: 1px solid #e8d695;
}

.status-selesai {
    background: #e3f7ee;
    color: #338164;
    border: 1px solid #a9dcc7;
}

.status-ditolak {
    background: #ffe8ed;
    color: #b64e67;
    border: 1px solid #efb4c1;
}


/* ==============================
   ACTION
================================ */

.action-container {
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
}

.action-btn {
    border: none;

    background: transparent;

    color: #65456a;

    font-size: 11px;

    cursor: pointer;

    padding: 3px;
}

.action-btn:hover {
    text-decoration: underline;
}

.action-danger {
    color: #c44f68;
}

.separator {
    color: #ccc;
}


/* ==============================
   EMPTY
================================ */

.empty {
    display: none;

    padding: 30px;

    text-align: center;

    color: #999;

    font-size: 13px;
}


/* ==============================
   MODAL
================================ */

.modal {
    position: fixed;

    inset: 0;

    background: rgba(30,20,30,.55);

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-content {
    width: 100%;

    max-width: 520px;

    background: white;

    border-radius: 12px;

    padding: 25px;

    max-height: 90vh;

    overflow-y: auto;
}

.modal-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 22px;
}

.modal-header h2 {
    font-size: 20px;
}

.close {
    border: none;

    background: #f3eef3;

    width: 32px;

    height: 32px;

    border-radius: 50%;

    font-size: 20px;

    cursor: pointer;
}


/* ==============================
   FORM
================================ */

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;

    font-size: 12px;

    font-weight: bold;

    margin-bottom: 7px;
}

.form-group input,
.form-group select {
    width: 100%;

    height: 42px;

    border: 1px solid #ddd5dd;

    border-radius: 7px;

    padding: 0 12px;

    outline: none;

    font-size: 13px;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #68436a;
}

.form-row {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;
}


/* ==============================
   FOOTER MODAL
================================ */

.modal-footer {
    display: flex;

    justify-content: flex-end;

    gap: 10px;

    margin-top: 22px;
}

.btn-cancel {
    border: 1px solid #ddd5dd;

    background: white;

    color: #555;

    padding: 11px 18px;

    border-radius: 7px;

    cursor: pointer;
}


/* ==============================
   DETAIL
================================ */

.detail-box {
    background: #faf8fa;

    border: 1px solid #eee6ee;

    border-radius: 8px;

    padding: 15px;
}

.detail-row {
    display: flex;

    justify-content: space-between;

    padding: 11px 0;

    border-bottom: 1px solid #eee7ee;

    font-size: 13px;
}

.detail-row:last-child {
    border-bottom: none;
}

.detail-label {
    color: #8b818b;
}

.detail-value {
    font-weight: bold;

    color: #3b303b;
}


/* ==============================
   RESPONSIVE
================================ */

@media (max-width: 850px) {

    .sidebar {
        width: 75px;

        padding: 20px 10px;
    }

    .logo {
        text-align: center;
        padding: 0 0 25px;
    }

    .logo h2 {
        font-size: 13px;
    }

    .logo span {
        display: none;
    }

    .menu {
        text-align: center;
        padding: 12px 5px;
        font-size: 0;
    }

    .menu span {
        font-size: 18px;
        width: auto;
    }

    .main {
        margin-left: 75px;

        width: calc(100% - 75px);

        padding: 25px 18px;
    }

    .filter-card {
        grid-template-columns: 1fr;
    }
}


@media (max-width: 550px) {

    .main {
        padding: 18px 12px;
    }

    .header {
        flex-direction: column;
        align-items: stretch;
    }

    .header .btn-primary {
        width: 100%;
    }

    .form-row {
        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>

<div class="app">


<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div class="logo">
        <h2>Joy Salon</h2>
        <span>Admin</span>
    </div>

    <nav>

        <button class="menu">
            <span>⌂</span>
            Beranda
        </button>

        <button class="menu active">
            <span>▣</span>
            Reservasi
        </button>

        <button class="menu">
            <span>⇄</span>
            Transaksi
        </button>

        <button class="menu">
            <span>✂️</span>
            Treatment
        </button>

        <button class="menu">
            <span>♙</span>
            Pelanggan
        </button>

        <button class="menu">
            <span>♙</span>
            Karyawan
        </button>

        <button class="menu">
            <span>⚙️</span>
            Pengguna
        </button>

        <button class="menu">
            <span>▤</span>
            Laporan
        </button>

        <button class="menu logout" onclick="logout()">
            <span>↪️</span>
            Keluar
        </button>

    </nav>

</aside>


<!-- =========================
     MAIN
========================= -->

<main class="main">


<header class="header">

    <div>

        <h1>Reservasi</h1>

        <p id="tanggalHari">
            Kamis, 8 Oktober 2026
        </p>

    </div>

    <button
        class="btn-primary"
        onclick="openTambah()"
    >
        + Tambah reservasi
    </button>

</header>


<!-- =========================
     FILTER
========================= -->

<section class="filter-card">

    <input
        type="text"
        id="searchInput"
        placeholder="Cari nama pelanggan atau nomor HP..."
        onkeyup="renderData()"
    >

    <input
        type="date"
        id="dateFilter"
        onchange="renderData()"
    >

    <select
        id="statusFilter"
        onchange="renderData()"
    >

        <option value="">
            Semua status
        </option>

        <option value="Menunggu">
            Menunggu
        </option>

        <option value="Dikonfirmasi">
            Dikonfirmasi
        </option>

        <option value="Selesai">
            Selesai
        </option>

        <option value="Ditolak">
            Ditolak
        </option>

    </select>

</section>


<!-- =========================
     TABLE
========================= -->

<section class="table-card">

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>Kode</th>

<th>Pelanggan</th>

<th>Treatment</th>

<th>Jam</th>

<th>Karyawan</th>

<th>Status</th>

<th>Aksi</th>

</tr>

</thead>

<tbody id="reservationTable"></tbody>

</table>

</div>

<div id="emptyData" class="empty">
    Data reservasi tidak ditemukan.
</div>

</section>

</main>

</div>


<!-- =========================
     MODAL FORM
========================= -->

<div
    class="modal"
    id="formModal"
>

<div class="modal-content">


<div class="modal-header">

<h2 id="modalTitle">
    Tambah Reservasi
</h2>

<button
    onclick="closeModal()"
    class="close"
>
    ×
</button>

</div>


<form id="reservationForm">

<input
    type="hidden"
    id="editIndex"
>


<div class="form-group">

<label>Kode Reservasi</label>

<input
    type="text"
    id="kode"
    required
>

</div>


<div class="form-group">

<label>Nama Pelanggan</label>

<input
    type="text"
    id="pelanggan"
    placeholder="Masukkan nama pelanggan"
    required
>

</div>


<div class="form-group">

<label>Nomor HP</label>

<input
    type="tel"
    id="hp"
    placeholder="08xxxxxxxxxx"
    required
>

</div>


<div class="form-group">

<label>Treatment</label>

<select id="treatment" required>

<option value="">
Pilih treatment
</option>

<option>Smoothing</option>

<option>Potong pria</option>

<option>Creambath + potong</option>

<option>Hair spa</option>

<option>Facial dasar</option>

<option>Hair coloring</option>

</select>

</div>


<div class="form-row">

<div class="form-group">

<label>Tanggal</label>

<input
    type="date"
    id="tanggal"
    required
>

</div>


<div class="form-group">

<label>Jam</label>

<input
    type="time"
    id="jam"
    required
>

</div>

</div>


<div class="form-group">

<label>Karyawan</label>

<select id="karyawan" required>

<option value="">
Pilih karyawan
</option>

<option>Rina</option>

<option>Bagas</option>

<option>Tika</option>

<option>Dina</option>

</select>

</div>


<div class="form-group">

<label>Status</label>

<select id="status" required>

<option>Menunggu</option>

<option>Dikonfirmasi</option>

<option>Selesai</option>

<option>Ditolak</option>

</select>

</div>


<div class="modal-footer">

<button
    type="button"
    class="btn-cancel"
    onclick="closeModal()"
>
Batal
</button>

<button
    type="submit"
    class="btn-primary"
>
Simpan
</button>

</div>

</form>

</div>

</div>


<!-- =========================
     MODAL DETAIL
========================= -->

<div
    class="modal"
    id="viewModal"
>

<div class="modal-content">

<div class="modal-header">

<h2>Detail Reservasi</h2>

<button
    onclick="closeView()"
    class="close"
>
×
</button>

</div>


<div id="detailReservasi"></div>


<div class="modal-footer">

<button
    class="btn-cancel"
    onclick="closeView()"
>
Tutup
</button>

</div>

</div>

</div>


<script>

/* ==================================
   DATA
================================== */

let reservations =
JSON.parse(
    localStorage.getItem(
        "joySalonReservations"
    )
) || [

{
    kode: "RS-1043",
    pelanggan: "Brigita",
    hp: "081234567890",
    treatment: "Smoothing",
    tanggal: "2026-09-18",
    jam: "15:00",
    karyawan: "Rina",
    status: "Menunggu"
},

{
    kode: "RS-1042",
    pelanggan: "Mahesa",
    hp: "082345678901",
    treatment: "Potong pria",
    tanggal: "2026-09-18",
    jam: "13:00",
    karyawan: "Bagas",
    status: "Dikonfirmasi"
},

{
    kode: "RS-1041",
    pelanggan: "Jesika",
    hp: "083456789012",
    treatment: "Creambath + potong",
    tanggal: "2026-09-18",
    jam: "11:30",
    karyawan: "Tika",
    status: "Selesai"
},

{
    kode: "RS-1040",
    pelanggan: "Nafa",
    hp: "084567890123",
    treatment: "Hair spa",
    tanggal: "2026-09-18",
    jam: "10:00",
    karyawan: "Rina",
    status: "Selesai"
},

{
    kode: "RS-1039",
    pelanggan: "Putri",
    hp: "085678901234",
    treatment: "Facial dasar",
    tanggal: "2026-09-18",
    jam: "16:30",
    karyawan: "-",
    status: "Ditolak"
}

];


/* ==================================
   SIMPAN
================================== */

function saveData() {

    localStorage.setItem(
        "joySalonReservations",
        JSON.stringify(reservations)
    );

}


/* ==================================
   TAMPIL DATA
================================== */

function renderData() {

    const table =
        document.getElementById(
            "reservationTable"
        );

    const empty =
        document.getElementById(
            "emptyData"
        );


    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase();


    const date =
        document.getElementById(
            "dateFilter"
        ).value;


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    table.innerHTML = "";


    const filtered =
        reservations.filter(item => {

            const searchMatch =
                item.pelanggan
                .toLowerCase()
                .includes(search)
                ||
                item.hp
                .toLowerCase()
                .includes(search);


            const dateMatch =
                date === ""
                ||
                item.tanggal === date;


            const statusMatch =
                status === ""
                ||
                item.status === status;


            return (
                searchMatch &&
                dateMatch &&
                statusMatch
            );

        });


    if (filtered.length === 0) {

        empty.style.display = "block";

        return;

    }


    empty.style.display = "none";


    filtered.forEach(item => {

        const index =
            reservations.indexOf(item);


        const row =
            document.createElement("tr");


        row.innerHTML = `

<td>
    ${item.kode}
</td>

<td>
    <strong>${item.pelanggan}</strong>
</td>

<td>
    ${item.treatment}
</td>

<td>
    ${item.jam}
</td>

<td>
    ${item.karyawan}
</td>

<td>
    ${getStatus(item.status)}
</td>

<td>
    ${getActions(item.status,index)}
</td>

`;


        table.appendChild(row);

    });

}


/* ==================================
   STATUS
================================== */

function getStatus(status) {

    let className = "";


    if (status === "Menunggu")
        className =
            "status-menunggu";


    if (status === "Dikonfirmasi")
        className =
            "status-dikonfirmasi";


    if (status === "Selesai")
        className =
            "status-selesai";


    if (status === "Ditolak")
        className =
            "status-ditolak";


    return `
        <span class="status ${className}">
            ${status}
        </span>
    `;

}


/* ==================================
   AKSI
================================== */

function getActions(status,index) {


    if (status === "Menunggu") {

        return `

<div class="action-container">

<button
class="action-btn"
onclick="confirmReservation(${index})"
>
Konfirmasi
</button>

<span class="separator">·</span>

<button
class="action-btn action-danger"
onclick="rejectReservation(${index})"
>
Tolak
</button>

</div>

`;

    }


    if (status === "Dikonfirmasi") {

        return `

<div class="action-container">

<button
class="action-btn"
onclick="editData(${index})"
>
Ubah
</button>

<span class="separator">·</span>

<button
class="action-btn"
onclick="finishReservation(${index})"
>
Selesai
</button>

</div>

`;

    }


    return `

<button
class="action-btn"
onclick="lihatData(${index})"
>
Lihat
</button>

`;

}


/* ==================================
   TAMBAH
================================== */

function openTambah() {

    document
        .getElementById(
            "reservationForm"
        )
        .reset();


    document
        .getElementById(
            "editIndex"
        )
        .value = "";


    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
        "Tambah Reservasi";


    document
        .getElementById(
            "kode"
        )
        .value =
        generateKode();


    document
        .getElementById(
            "tanggal"
        )
        .value =
        "2026-09-18";


    document
        .getElementById(
            "formModal"
        )
        .classList.add("show");

}


/* ==================================
   GENERATE KODE
================================== */

function generateKode() {

    let number = 1044;


    reservations.forEach(item => {

        const n =
            parseInt(
                item.kode.replace(
                    "RS-",
                    ""
                )
            );


        if (n >= number)
            number = n + 1;

    });


    return "RS-" + number;

}


/* ==================================
   TUTUP MODAL
================================== */

function closeModal() {

    document
        .getElementById(
            "formModal"
        )
        .classList.remove("show");

}


/* ==================================
   SIMPAN FORM
================================== */

document
.getElementById(
    "reservationForm"
)
.addEventListener()
    "submit",
    function(e) {

        e.preventDefault();


        const index =
            document.getElementById("edi") 
    }
